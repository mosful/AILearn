<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的第一個網頁</title>
<style>
body{font:18px/1.8 "Microsoft JhengHei",sans-serif;margin:0;background:#f1f3ec;color:#193f32}
main{max-width:800px;margin:auto;padding:28px 20px}section{padding:28px 0}h1{font-size:36px;line-height:1.3}a{color:inherit}a:focus-visible,input:focus-visible{outline:3px solid #956200;outline-offset:4px}label{display:block;padding:10px;background:white;margin:8px 0}input{width:22px;height:22px;vertical-align:middle}
</style>

















<style data-forest-theme>
:root{--bg:#f1f3ec;--surface:#e2e9db;--paper:#fff;--ink:#193f32;--muted:#506151;--accent:#d9e9a4;--focus:#8a681d;}
body{background:var(--bg);color:var(--ink)}
a:focus-visible,input:focus-visible,summary:focus-visible{outline-color:var(--focus)}
.hero{background:var(--ink);color:var(--paper)}
.button{background:var(--accent);color:var(--ink)}
.location{background:var(--surface)}
@media print{body{background:#fff;color:#000}.hero{background:#fff;color:#000}}
</style>
</head>
<body><main>
<h1>我的第一個網頁</h1>
<p>虛構教學示範。請改成你自己的主題。</p>
<nav><a href="#plan">看行程</a>　<a href="#list">準備清單</a></nav>
<section id="plan"><h2>活動行程</h2><p>示範日期 2026/12/12，09:00 集合、09:30 散步、11:00 分享。</p><a href="https://www.google.com/maps/search/?api=1&amp;query=%E5%A4%A7%E5%AE%89%E6%A3%AE%E6%9E%97%E5%85%AC%E5%9C%92" target="_blank" rel="noopener">查看大安森林公園地圖</a></section>
<section id="list"><h2>準備清單</h2><label><input type="checkbox"> 水壺</label><label><input type="checkbox"> 雨具</label><p>重新整理會重設勾選。</p></section>
</main>



















<!-- course-footer:start -->
<style data-course-footer-style>
[data-course-footer]{box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;max-width:100%;margin:32px auto 0;padding:24px 20px;color:#506151;background:#f1f3ec;text-align:center;font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif;line-height:1.7}
[data-course-footer] small{display:block;font-size:14px;max-width:80ch;font-weight:400}[data-course-footer] a{color:inherit;text-underline-offset:4px;overflow-wrap:anywhere}[data-course-footer] .course-contact{position:relative;display:block;padding:0;margin:0;background:transparent;color:inherit;border:0;text-align:center}
[data-course-footer] .course-contact>summary{list-style:none;display:block;font:inherit;font-size:14px;font-weight:400;line-height:1.5;padding:12px 16px;margin:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;background:transparent}
[data-course-footer] .course-contact>summary::-webkit-details-marker{display:none}[data-course-footer] .course-contact>summary::marker{content:""}
[data-course-footer] .course-contact-card{position:absolute;z-index:100;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:300px;max-width:calc(100vw - 32px);box-sizing:border-box;padding:18px 20px;background:#fff;color:#193f32;box-shadow:0 10px 32px rgb(0 0 0 / .18);font-size:16px;line-height:1.7;text-align:left;animation:none}
[data-course-footer] .course-contact-card strong{display:block;font-size:18px;margin:0 44px 10px 0}[data-course-footer] .course-contact-card a{display:block;padding:8px 0;margin:0;min-height:42px}
[data-course-footer] .course-contact-close{position:absolute;right:8px;top:8px;padding:8px;background:transparent;border:0;color:inherit;font:inherit;font-size:14px;min-width:44px;min-height:40px;cursor:pointer}
[data-course-footer] :focus-visible{outline:3px solid #8a681d;outline-offset:3px}
@media print{[data-course-footer]{display:flex!important;background:#fff;break-inside:avoid;padding:12px 0;margin-top:24px}[data-course-footer] small{font-size:9pt}[data-course-footer] .course-contact>summary,[data-course-footer] .course-contact-card{display:none!important}}
[data-back-to-top]{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:90;display:flex;align-items:center;gap:6px;min-width:48px;min-height:48px;padding:10px 16px;border:0;border-radius:999px;background:#193f32;color:#fff;font:600 15px/1 "Microsoft JhengHei","PingFang TC",system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 20px rgb(0 0 0 / .22);opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .2s,transform .2s,visibility .2s}
[data-back-to-top].is-visible{opacity:1;visibility:visible;transform:none}[data-back-to-top]:hover{background:#2c5e4b}
[data-back-to-top]:focus-visible{outline:3px solid #d9e9a4;outline-offset:3px}[data-back-to-top] span[aria-hidden]{font-size:18px}
@media(max-width:600px){[data-back-to-top] .back-to-top-text{display:none}[data-back-to-top]{padding:0;justify-content:center;width:48px}}
@media(prefers-reduced-motion:reduce){[data-back-to-top]{transition:none}}
@media print{[data-back-to-top]{display:none!important}}
</style>

<script data-course-footer-script>
(()=>{const c=document.querySelector('[data-course-footer] .course-contact');if(!c)return;const close=()=>{c.open=false;c.querySelector('summary').focus()};c.querySelector('.course-contact-close').addEventListener('click',close);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&c.open){e.preventDefault();close()}});document.addEventListener('click',e=>{if(c.open&&!c.contains(e.target))c.open=false})})();
(()=>{const b=document.querySelector('[data-back-to-top]');if(!b)return;const sync=()=>b.classList.toggle('is-visible',scrollY>Math.max(40,Math.min(400,(document.documentElement.scrollHeight-innerHeight)/2)));addEventListener('scroll',sync,{passive:true});sync();b.addEventListener('click',()=>{const r=matchMedia('(prefers-reduced-motion: reduce)').matches;scrollTo({top:0,behavior:r?'auto':'smooth'});const t=document.querySelector('h1,main,[role=main]');if(t){if(!t.hasAttribute('tabindex'))t.setAttribute('tabindex','-1');t.focus({preventScroll:true});}})})();
</script>
<!-- course-footer:end -->
